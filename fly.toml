# fly.toml app configuration file generated for polybot-api-blue-fern-6552 on 2026-09-13T00:02:31-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'polybot-api-blue-fern-6552'
primary_region = 'iad'

[build]
[env]
  HOST = '0.0.0.0'
  PORT = '3001'
  RACE_EVENT_FILE = '/data/race-events.jsonl'
  RACE_MODE = 'live'
  WEB_DIST = '/nonexistent'

[[mounts]]
  source = 'polybot_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 400
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/meta'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
